<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Premium color gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" /> <!-- Indigo -->
      <stop offset="50%" stop-color="#8B5CF6" /> <!-- Violet -->
      <stop offset="100%" stop-color="#EC4899" /> <!-- Pink -->
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#8B5CF6" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Dark slate premium background -->
  <rect width="256" height="256" rx="60" fill="#0F172A" />

  <!-- Shopping Cart Icon -->
  <g filter="url(#glow)">
    <!-- Basket Outline -->
    <path d="M48 64h24l22 84h92l20-64H84" 
          stroke="url(#glowGrad)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />
    
    <!-- Wheels -->
    <circle cx="100" cy="188" r="16" fill="url(#glowGrad)" />
    <circle cx="176" cy="188" r="16" fill="url(#glowGrad)" />
  </g>
</svg>
